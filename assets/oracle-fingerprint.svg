<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 505" width="680" role="img">
  <title>Fingerprinting with four one-character probes</title>
  <style>
    text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; fill: #1e293b; }
    code { font-family: 'Cascadia Mono', Consolas, 'DejaVu Sans Mono', 'Courier New', monospace; }
    .title { font-size: 16px; }
    .group-title { font-size: 11px; fill: #64748b; }
    .probe { font-size: 12px; }
    .probe-sub { font-size: 10px; fill: #475569; }
    .out-line1 { font-size: 12px; }
    .out-line2 { font-size: 10px; fill: #475569; }
    .verdict { font-size: 12px; fill: #6b21a8; }
    .verdict-sub { font-size: 10px; fill: #475569; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f7"/>
    </marker>
  </defs>

  <!-- title -->
  <text x="340" y="32" text-anchor="middle" class="title">Fingerprinting with four one-character probes</text>

  <!-- dashed grouping box (probes container): x=40, y=60, w=600, h=337 -->
  <rect x="40" y="60" width="600" height="337" rx="10" stroke="#94a3b8" stroke-dasharray="6,4" fill="#f8fafc"/>
  <text x="50" y="74" class="group-title">probes sent to ?pic= (decoded values)</text>

  <!-- connectors: probe -> outcome, row centers y=115,194,273,352 -->
  <path d="M265,115 L 389,115" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M265,194 L 389,194" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M265,273 L 389,273" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M265,352 L 389,352" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- row 1: single quote -> blank page -->
  <rect x="60" y="88" width="200" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="160" y="110" text-anchor="middle" class="probe code">'</text>
  <text x="160" y="128" text-anchor="middle" class="probe-sub">single quote</text>
  <rect x="400" y="88" width="220" height="54" rx="6" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="510" y="110" text-anchor="middle" class="out-line1" fill="#9d174d">blank page</text>
  <text x="510" y="128" text-anchor="middle" class="out-line2">HTTP 200, 0 bytes</text>

  <!-- row 2: doubled quote -> normal page -->
  <rect x="60" y="167" width="200" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="160" y="189" text-anchor="middle" class="probe code">''</text>
  <text x="160" y="207" text-anchor="middle" class="probe-sub">doubled quote</text>
  <rect x="400" y="167" width="220" height="54" rx="6" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="510" y="189" text-anchor="middle" class="out-line1" fill="#166534">normal page</text>
  <text x="510" y="207" text-anchor="middle" class="out-line2">query still valid</text>

  <!-- row 3: backslash -> blank page -->
  <rect x="60" y="246" width="200" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="160" y="268" text-anchor="middle" class="probe code">\</text>
  <text x="160" y="286" text-anchor="middle" class="probe-sub">backslash</text>
  <rect x="400" y="246" width="220" height="54" rx="6" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="510" y="268" text-anchor="middle" class="out-line1" fill="#9d174d">blank page</text>
  <text x="510" y="286" text-anchor="middle" class="out-line2">closing quote escaped</text>

  <!-- row 4: case flip -> fox description -->
  <rect x="60" y="325" width="200" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="160" y="347" text-anchor="middle" class="probe code">FOX</text>
  <text x="160" y="365" text-anchor="middle" class="probe-sub">case flip</text>
  <rect x="400" y="325" width="220" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="510" y="347" text-anchor="middle" class="out-line1" fill="#1e40af">fox description</text>
  <text x="510" y="365" text-anchor="middle" class="out-line2">case-insensitive match</text>

  <!-- container -> conclusion -->
  <path d="M340,402 L 340,415" stroke="#a855f7" stroke-width="1.5" fill="none" marker-end="url(#arrow-purple)"/>

  <!-- conclusion box: x=60, y=426, w=560, h=54 -->
  <rect x="60" y="426" width="560" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="340" y="448" text-anchor="middle" class="verdict">verdict: single-quoted SQL literal, built by string interpolation</text>
  <text x="340" y="466" text-anchor="middle" class="verdict-sub">blank 200 = swallowed error; the page is a boolean oracle</text>
</svg>
